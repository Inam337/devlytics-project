<?xml version="1.0" encoding="utf-8"?>
<!-- Animated loading version. Original artwork/paths unchanged, only CSS animation added.
     Behaviour: top of the octopus stays fixed (it "hangs"), everything below swings.
     0-0.6s: left eye pops open (one time only, everything else holds still).
     0.6s onward: repeats forever -> ~7.5s active swinging/blinking, then ~2.5s asleep (eyes shut, still), then wakes and swings again. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 150.7 157.8" style="enable-background:new 0 0 150.7 157.8;" xml:space="preserve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style type="text/css">
	.st0{fill:url(#SVGID_1_);}
	.st1{fill:url(#SVGID_00000067939094130455000770000012112113364308055452_);}
	.st2{fill:url(#SVGID_00000095300484978623578750000016598379239534903987_);}
	.st3{fill:url(#SVGID_00000088102871248254912440000013556159831082985402_);}
	.st4{fill:url(#SVGID_00000054987891964080569010000014880221291007238072_);}
	.st5{fill:url(#SVGID_00000114771358025148486100000013632136507489259446_);}
	.st6{fill:url(#SVGID_00000011742897181685102430000015402207519055454099_);}
	.st7{fill:url(#SVGID_00000003792900700824631890000017042329179819714199_);}

	/* ================= Loading animation layer ================= */
	/* Everything pivots from its own TOP edge, so the top of the octopus
	   stays put (as if hanging) and only the lower part swings.
	   One 10s cycle, repeated forever, after a one-time 0.6s eye-pop intro:
	     0%   - 75%  active  (swings left and right, blinks)
	     75%  - 100% asleep  (eyes shut, nearly still, dim glow) then wakes back into 0% */

	#octopus-rig{
		transform-box: fill-box;
		transform-origin: 50% 0%;
		animation:
			octo-swing 10s ease-in-out 0.6s infinite,
			octo-glow 10s ease-in-out 0.6s infinite;
	}

	.tentacle{
		transform-box: fill-box;
		transform-origin: 50% 0%;
	}
	.tentacle-l2, .tentacle-r2{ animation: tentacle-swing 10s ease-in-out 0.60s infinite; }
	.tentacle-l1, .tentacle-r1{ animation: tentacle-swing 10s ease-in-out 0.66s infinite; }
	.tentacle-c{ animation: tentacle-swing 10s ease-in-out 0.72s infinite; }

	.eye{
		transform-box: fill-box;
		transform-origin: 50% 50%;
	}
	.eye-l{
		animation:
			eye-pop-intro 0.6s cubic-bezier(.34,1.56,.64,1) 0s 1 both,
			eye-cycle 10s ease-in-out 0.6s infinite;
	}
	.eye-r{
		animation: eye-cycle 10s ease-in-out 0.6s infinite;
	}

	@keyframes octo-swing{
		0%   { transform: rotate(0deg)   scale(1); }
		12%  { transform: rotate(-4deg)  scale(1); }
		25%  { transform: rotate(0deg)   scale(1); }
		37%  { transform: rotate(4deg)   scale(1); }
		50%  { transform: rotate(0deg)   scale(1); }
		62%  { transform: rotate(-4deg)  scale(1); }
		75%  { transform: rotate(0deg)   scale(1); }
		88%  { transform: rotate(0deg)   scale(1.025); }
		100% { transform: rotate(0deg)   scale(1); }
	}
	@keyframes octo-glow{
		0%   { filter: drop-shadow(0 0 5px rgba(11,125,158,0.30)); }
		37%  { filter: drop-shadow(0 0 14px rgba(50,44,115,0.55)); }
		75%  { filter: drop-shadow(0 0 5px rgba(11,125,158,0.30)); }
		88%  { filter: drop-shadow(0 0 3px rgba(11,125,158,0.18)); }
		100% { filter: drop-shadow(0 0 5px rgba(11,125,158,0.30)); }
	}
	@keyframes tentacle-swing{
		0%   { transform: rotate(0deg)   scale(1); }
		12%  { transform: rotate(-7deg)  scale(1.02); }
		25%  { transform: rotate(0deg)   scale(1.04); }
		37%  { transform: rotate(7deg)   scale(1.02); }
		50%  { transform: rotate(0deg)   scale(1); }
		62%  { transform: rotate(-7deg)  scale(1.02); }
		75%  { transform: rotate(0deg)   scale(1); }
		88%  { transform: rotate(1deg)   scale(1.01); }
		100% { transform: rotate(0deg)   scale(1); }
	}
	@keyframes eye-pop-intro{
		0%   { transform: scale(0); opacity: 0; }
		45%  { transform: scale(1.4); opacity: 1; }
		70%  { transform: scale(0.82); }
		100% { transform: scale(1); }
	}
	@keyframes eye-cycle{
		0%   { transform: scaleY(1); }
		14%  { transform: scaleY(1); }
		16%  { transform: scaleY(0.12); }
		18%  { transform: scaleY(1); }
		45%  { transform: scaleY(1); }
		47%  { transform: scaleY(0.12); }
		49%  { transform: scaleY(1); }
		74%  { transform: scaleY(1); }
		80%  { transform: scaleY(0.08); }
		96%  { transform: scaleY(0.08); }
		100% { transform: scaleY(1); }
	}

	@media (prefers-reduced-motion: reduce){
		#octopus-rig, .tentacle, .eye{ animation: none !important; }
	}
</style>
